name: Create SES Email Identity

on:
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: "Environment"
        default: "dev"
      email_identity:
        description: "Email address or domain to verify in AWS SES"
        required: true
        type: string

jobs:
  create-identity:
    runs-on: ubuntu-22.04
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set AWS Account Number
        id: account-mapping
        run: |
          case "${{ inputs.environment }}" in
            dev)
              echo "aws_account=716537843042" >> $GITHUB_OUTPUT
              ;;
            uat)
              echo "aws_account=272103761966" >> $GITHUB_OUTPUT
              ;;
            prd)
              echo "aws_account=617842005266" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Unknown environment: ${{ inputs.environment }}"
              exit 1
              ;;
          esac

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.account-mapping.outputs.aws_account }}:role/ch-iam-shared-deployment-role-${{ inputs.environment }}
          aws-region: us-east-1

      - name: Create SES Email Identity
        run: |
          echo "Creating SES email identity for: ${{ github.event.inputs.email_identity }}"
          aws sesv2 create-email-identity \
            --email-identity "${{ github.event.inputs.email_identity }}"
