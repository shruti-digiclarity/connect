name: CCaaS Demo

on:
  push:
    paths:
      - "demo/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - name: Set AWS deployment configuration
        id: cfg
        run: |
          echo "ACCOUNT=501046919017" >> "$GITHUB_OUTPUT"
          echo "ROLE=github-actions-terraform-role" >> "$GITHUB_OUTPUT"
          echo "REGION=us-east-1" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.cfg.outputs.ACCOUNT }}:role/${{ steps.cfg.outputs.ROLE }}
          role-session-name: GitHubActions-CCaaS-Demo-${{ github.run_id }}
          aws-region: ${{ steps.cfg.outputs.REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity --region "${{ steps.cfg.outputs.REGION }}"

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: demo
        run: terraform init

      - name: Terraform apply
        working-directory: demo
        run: terraform apply -auto-approve

      - name: Get Lambda ARN
        id: terraform-output
        working-directory: demo
        run: echo "lambda_arn=$(terraform output -raw lambda_arn)" >> "$GITHUB_OUTPUT"

      - name: Trigger Lambda
        run: |
          aws lambda invoke \
            --region "${{ steps.cfg.outputs.REGION }}" \
            --function-name "${{ steps.terraform-output.outputs.lambda_arn }}" \
            --payload '{"source":"github-actions","message":"CCaaS demo deployment completed"}' \
            --cli-binary-format raw-in-base64-out \
            lambda-response.json
          cat lambda-response.json