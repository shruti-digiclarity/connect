name: AWS Infrastructure Deployment Pipeline (Multi-Region)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - uat
          - prd

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # ------------------------------------------------------------------
  # 1. Prepare environment and checkout code (no branch validation)
  # ------------------------------------------------------------------
  prepare:
    name: Prepare Environment
    runs-on: ubuntu-22.04
    outputs:
      env: ${{ steps.set-env.outputs.env }}
    steps:
      - name: Set Environment
        id: set-env
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment }}"

          echo "Deploying to environment: $ENVIRONMENT"

          # Basic validation of the input (in case choice is bypassed)
          if [[ ! "$ENVIRONMENT" =~ ^(dev|uat|prd)$ ]]; then
            echo "Error: Invalid environment '$ENVIRONMENT'"
            exit 1
          fi

          echo "env=$ENVIRONMENT" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

  # ------------------------------------------------------------------
  # 2. Deploy Infrastructure to us-east-1
  # ------------------------------------------------------------------
  deploy-use1:
    name: Deploy Infrastructure to us-east-1 (${{ github.event.inputs.environment }})
    needs: prepare
    uses: CloverHealth/ccaas-shared-pipelines/.github/workflows/aws_infrastructure_deploy.yml@master
    with:
      WORKING_DIRECTORY: resources
      ENVIRONMENTS_CONFIG_DIR: environments
      AWS_REGION: us-east-1
      CI_ENVIRONMENT_NAME: ${{ needs.prepare.outputs.env }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  # ------------------------------------------------------------------
  # 3. Deploy Infrastructure to us-west-2 (after use1 succeeds)
  # ------------------------------------------------------------------
  deploy-usw2:
    name: Deploy Infrastructure to us-west-2 (${{ github.event.inputs.environment }})
    needs: [prepare, deploy-use1]
    uses: CloverHealth/ccaas-shared-pipelines/.github/workflows/aws_infrastructure_deploy.yml@master
    with:
      WORKING_DIRECTORY: resources
      ENVIRONMENTS_CONFIG_DIR: environments
      AWS_REGION: us-west-2
      CI_ENVIRONMENT_NAME: ${{ needs.prepare.outputs.env }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}