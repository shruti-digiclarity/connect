name: Deploy to Production Environment

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deployment-pipeline:
    name: Deploy to prd
    uses: CloverHealth/ccaas-shared-pipelines/.github/workflows/aws_infrastructure_deploy.yml@master
    with:
      WORKING_DIRECTORY: resources
      ENVIRONMENTS_CONFIG_DIR: environments
      AWS_REGION: us-east-1
      CI_ENVIRONMENT_NAME: prd
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
