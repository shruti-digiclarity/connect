      AllowedAccessControlTags:
        - Key: company
          Value: !Ref pCompanyPrefix
        - Key: lob
          Value: !Ref pLOB
      TagRestrictedResources:
        - RoutingProfile
        - OperatingHours
        - User
        - SecurityProfile
        - Queue
      Tags:
        - Key: company
          Value: !Ref pCompanyPrefix
        - Key: lob
          Value: !Ref pLOB
      Permissions:
