  CHtelesalesAgentProfile:
    Type: AWS::Connect::SecurityProfile
    DeletionPolicy: Delete
    Properties:
      InstanceArn: !Ref pConnectInstanceArn
      SecurityProfileName: ch_telesales_agent_profile
      Description: An agent is a user of the system that is focused on customer care and/or sales. Their role is unlikely to be technical.
      AllowedAccessControlTags:
        - Key: company
          Value: !Ref pCompanyPrefix
        - Key: lob
          Value: !Ref pLOB
      TagRestrictedResources:
        - RoutingProfile
        - OperatingHours
        - User
        - SecurityProfile
        - Queue
      Tags:
        - Key: company
          Value: !Ref pCompanyPrefix
        - Key: lob
          Value: !Ref pLOB
      Permissions:
        - BasicAgentAccess
        - OutboundCallAccess
        - OutboundEmail.Create

  CHtelesalesQAProfile:
    Type: AWS::Connect::SecurityProfile
    DeletionPolicy: Delete
    Properties:
      InstanceArn: !Ref pConnectInstanceArn
      SecurityProfileName: ch_telesales_qa_profile
