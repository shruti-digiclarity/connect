AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Connect Security Profiles

Parameters:
  pConnectInstanceArn:
    Type: String
    Description: The ARN of the Connect instance

  pCompanyPrefix:
    Type: String
    Description: The company prefix value

  pLOB:
    Type: String
    Description: The line of business value

Resources:

  CHtelesalesAdminProfile:
    Type: AWS::Connect::SecurityProfile
    DeletionPolicy: Delete
    Properties:
      InstanceArn: !Ref pConnectInstanceArn
      SecurityProfileName: ch_telesales_admin_profile
      Description: An administrator can perform all actions available.
      AllowedAccessControlTags:
        - Key: company
          Value: !Ref pCompanyPrefix
        - Key: lob
          Value: !Ref pLOB
      TagRestrictedResources:
        - RoutingProfile
        - OperatingHours
        - User
        - SecurityProfile
        - Queue
      Tags:
        - Key: company
          Value: !Ref pCompanyPrefix
        - Key: lob
          Value: !Ref pLOB
      Permissions:
